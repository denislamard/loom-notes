[project]
name = "loom-memory"
version = "1.1.0"
description = "Mémoire locale pour Claude Desktop et les agents LOOM - serveur MCP + RAG hybride (BGE-M3, reranking, Qdrant)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Denis Lamard" }]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "qdrant-client>=1.15",
    "markdownify>=1.1",
    "lxml>=5.0",
    "httpx>=0.28",
    "typer>=0.16",
    "fastmcp>=4.0",
]

[project.scripts]
loom-memory = "loom_memory.cli:app"
loom-memory-mcp = "loom_memory.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "lxml-stubs>=0.5",
]
models = [
    "FlagEmbedding>=1.3",
    "torch>=2.7",
    # FlagEmbedding 1.4 casse avec transformers 5 (tokenizer.pad reçoit une liste) : on reste en v4.
    "transformers>=4.44,<5",
]

[tool.uv]
default-groups = ["dev", "models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_memory"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
