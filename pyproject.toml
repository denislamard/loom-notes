[project]
name = "loom-notes"
version = "1.1.0"
description = "Mémoire locale pour Claude Desktop et les agents IA - serveur MCP + RAG hybride (BGE-M3, reranking, Qdrant)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Denis Lamard" }]
keywords = ["mcp", "rag", "mémoire", "qdrant", "bge-m3", "reranking", "claude"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
# Bornes hautes sur les dépendances qui cassent d'une majeure à l'autre (typer est encore en 0.x).
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "qdrant-client>=1.15,<2",
    "markdownify>=1.1",
    "lxml>=5.0",
    "httpx>=0.28",
    "typer>=0.16,<1",
    "fastmcp>=4.0,<5",
]

[project.scripts]
loom-notes = "loom_notes.cli:app"
loom-notes-mcp = "loom_notes.server:main"

[project.optional-dependencies]
models = [
    "FlagEmbedding>=1.3",
    "torch>=2.7",
    # FlagEmbedding 1.4 casse avec transformers 5 (tokenizer.pad reçoit une liste) : on reste en v4.
    "transformers>=4.44,<5",
]

[project.urls]
Repository = "https://github.com/denislamard/loom-notes"
Issues = "https://github.com/denislamard/loom-notes/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "lxml-stubs>=0.5",
]
# En dev, `uv sync` installe aussi l'extra models (groupes par défaut ci-dessous).
models = ["loom-notes[models]"]

[tool.uv]
default-groups = ["dev", "models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/loom_notes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
